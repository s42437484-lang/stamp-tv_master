name: Build APK from Zip Source

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'Direct URL to the source code ZIP file'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository structure
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download and Extract Source ZIP
        run: |
          curl -L -o source.zip "${{ github.event.inputs.zip_url }}"
          mkdir -p src_dir
          unzip -q source.zip -d src_dir
          # Locate the actual root folder containing build.gradle or settings.gradle
          PROJECT_DIR=$(find src_dir -maxdepth 2 -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1 | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Grant execute permission to Gradle wrapper
        run: |
          chmod +x ${{ env.PROJECT_DIR }}/gradlew

      - name: Build Release APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compiled-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/*.apk