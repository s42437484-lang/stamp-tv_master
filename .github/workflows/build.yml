name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Find and Build APK
      run: |
        # Yeh automatic script khud hi dhoond legi ke gradlew kahan par hai
        if [ -f "./gradlew" ]; then
          GRADLE_DIR="."
        else
          GRADLE_DIR=$(find . -name "gradlew" -maxdepth 3 -exec dirname {} \;)
        fi
        
        echo "Found gradlew in: $GRADLE_DIR"
        cd "$GRADLE_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: stamp-tv-apk
        path: "**/build/outputs/apk/debug/*.apk"
