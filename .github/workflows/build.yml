name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build APK
      run: |
        GRADLE_FILE=$(find . -name "gradlew" -print -quit)
        if [ -z "$GRADLE_FILE" ]; then
          echo "gradlew kahin nahi mila repo mein!"
          exit 1
        fi
        GRADLE_DIR=$(dirname "$GRADLE_FILE")
        echo "Project root: $GRADLE_DIR"
        cd "$GRADLE_DIR"
        chmod +x gradlew
        ./gradlew assembleStableDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: stamp-tv-apk
        path: "**/build/outputs/apk/**/*.apk"
