name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK
      run: |
        # Agar gradlew root par nahi hai toh pehli milne wali gradlew ki folder mein chale jao
        GRADLE_FILE=$(find . -name "gradlew" -print -quit)
        GRADLE_DIR=$(dirname "$GRADLE_FILE")
        
        echo "Gradle directory found at: $GRADLE_DIR"
        cd "$GRADLE_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: upload/action-artifact@v4 # (ya upload-artifact@v4)
      with:
        name: stamp-tv-apk
        path: "**/build/outputs/apk/debug/*.apk"
